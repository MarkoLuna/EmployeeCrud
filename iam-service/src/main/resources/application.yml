server:
  port: 8082

spring:
  application:
    name: iam-service
  
  # Keycloak Configuration for External Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8083/realms/baeldung
          jwk-set-uri: http://localhost:8083/realms/baeldung/protocol/openid-connect/certs
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_db
    username: employee_user
    password: employee_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Keycloak Client Configuration
app:
  keycloak:
    url: http://localhost:8083
    realm: baeldung
    client-id: newClient
    client-secret: newClientSecret
    admin-user: admin
    admin-password: admin

# Keycloak Admin Configuration
keycloak:
  admin:
    server-url: http://localhost:8083
    realm: baeldung
    username: admin
    password: admin
    client-id: admin-cli
    client-secret: ""

# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG
    com.authserver: DEBUG
